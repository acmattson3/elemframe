<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ElemFrame</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="app">
<section id="dashboard" class="screen active"><div class="landing"><h1>ElemFrame</h1><p>by Andrew Mattson</p><button class="big" id="manage">Manage media <span>›</span></button><button class="big" id="play">Play slideshow <span>▶</span></button><label class="shuffle"><input type="checkbox" id="shuffle"> Shuffle slideshow</label><label class="setting">Display time <span id="displayValue">7s</span><input id="displayTime" type="range" min="3" max="15" step="0.5" value="7"></label><label class="setting">Transition time <span id="transitionValue">0s</span><input id="transitionTime" type="range" min="0" max="5" step="0.5" value="0"></label><p id="dashboardCountdown" role="timer" aria-live="off">Slideshow starts in 30s</p><p id="settingsStatus" role="status" aria-live="polite"></p></div></section>
<section id="manager" class="screen"><header><button id="home" class="copy">‹ Dashboard</button><h2>Manage media</h2><span class="header-side"></span></header><main class="panes"><article class="pane" id="removablePane"><div class="pane-top"><div><small>FROM</small><h3>USB / SD card</h3></div><button class="refresh" data-side="removable" title="Refresh">↻</button></div><div class="crumb" data-crumb="removable"></div><div class="toolbar"><button data-action="mkdir" data-side="removable">+ Folder</button><button data-action="rename" data-side="removable">Rename</button><button data-action="delete" data-side="removable">Delete</button><button class="hidden" data-deselect="removable">Deselect all</button><button class="hidden" data-deleteall="removable">Delete all</button></div><div class="filelist" data-list="removable"></div><div class="pane-bottom"><span id="removableCount">0 selected</span></div></article>
<div class="middle"><button id="copyRight" class="copy" title="Copy to computer">Copy →</button><button id="copyLeft" class="copy" title="Copy to USB/SD">← Copy</button></div>
<article class="pane" id="localPane"><div class="pane-top"><div><small>ON THIS COMPUTER</small><h3>Photo library</h3></div><button class="refresh" data-side="local" title="Refresh">↻</button></div><div class="crumb" data-crumb="local"></div><div class="toolbar"><button data-action="mkdir" data-side="local">+ Folder</button><button data-action="rename" data-side="local">Rename</button><button data-action="delete" data-side="local">Delete</button><button class="hidden" data-deselect="local">Deselect all</button><button class="hidden" data-deleteall="local">Delete all</button></div><div class="filelist" data-list="local"></div><div class="pane-bottom"><span id="localCount">0 selected</span></div></article></main><footer id="status">Select files to copy. Drop onto a folder to move them.</footer></section>
<section id="slideshow" class="screen" aria-label="Slideshow"><div id="slideStage"></div><div id="slideOverlay"><button id="slideResume" class="hidden" type="button">▶ Play video</button><div id="slideFilename"></div><div id="slideEmpty">No media yet. Tap to return.</div><div id="volumeControl"><div id="volumeSliderWrap" class="collapsed"><input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0" aria-label="Volume"></div><button id="volumeButton" type="button" aria-label="Show volume slider" aria-controls="volumeSliderWrap" aria-expanded="false" title="Volume">🔇</button></div></div></section>
<div id="dialogBackdrop" class="hidden"><div class="dialog"><h3 id="dialogTitle"></h3><input id="dialogInput" autocomplete="off"><div class="dialogButtons"><button id="dialogCancel">Cancel</button><button id="dialogConfirm" class="primary">OK</button></div></div></div><div id="dragGhost" class="hidden">Copy</div>
</div><script src="/app.js"></script></body></html>
