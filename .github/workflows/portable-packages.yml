name: Portable packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_portable.py ${{ matrix.target }}
      - name: Extract the release to a path containing spaces
        run: python -c "import pathlib,zipfile; p=next(pathlib.Path('dist').glob('*.zip')); zipfile.ZipFile(p).extractall('build/release check')"
      - if: runner.os == 'Linux'
        run: chmod +x 'build/release check/ElemFrame/ElemFrame'
      - name: Run the extracted application and media decoders
        run: python scripts/smoke_portable.py "build/release check/ElemFrame"
      - name: Check video controls in Microsoft Edge
        if: runner.os == 'Windows'
        run: python scripts/smoke_video_overlay.py --package "build/release check/ElemFrame" --screenshots build/video-overlay-check
      - name: Build Linux installer
        if: runner.os == 'Linux'
        run: python scripts/build_installer.py linux
      - name: Test Linux install, upgrade, and uninstall
        if: runner.os == 'Linux'
        run: python scripts/smoke_installer.py linux dist/ElemFrame-0.1.1-linux-x86_64-setup.run
      - name: Prepare pinned Inno Setup compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Compiler checksum mismatch' }
          $compiler = Join-Path $env:RUNNER_TEMP 'Inno Setup'
          $p = Start-Process $download -ArgumentList @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $compiler + '"')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Compiler setup failed' }
          "ELEMFRAME_ISCC=$compiler/ISCC.exe" >> $env:GITHUB_ENV
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: python scripts/build_installer.py windows --iscc "${{ env.ELEMFRAME_ISCC }}"
      - name: Test Windows install, upgrade, and uninstall
        if: runner.os == 'Windows'
        run: python scripts/smoke_installer.py windows dist/ElemFrame-0.1.1-windows-x86_64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ElemFrame-${{ matrix.target }}-x86_64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*-setup.run
            dist/*.sha256
